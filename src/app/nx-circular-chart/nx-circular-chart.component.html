<div
  class="nx-circular-chart-card"
  [class.nx-circular-chart-card--selected]="selected"
  [class.nx-circular-chart-card--disabled]="isEmpty"
  (click)="select.emit()"
>
  <!-- Gradient defs referenced from a point's own color as url(#id) — see
       NxCircularChartComponent.buildSeries()'s own comment. Zero-sized/absolutely
       positioned since it only exists to hold <linearGradient>s, not to render
       anything itself; must sit ahead of the chart in the DOM for Syncfusion's
       own SVG to resolve the url(#id) reference. -->
  <svg *ngIf="gradients.length" width="0" height="0" style="position: absolute">
    <defs>
      <linearGradient *ngFor="let g of gradients" [attr.id]="g.id" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" [attr.stop-color]="g.from"></stop>
        <stop offset="100%" [attr.stop-color]="g.to"></stop>
      </linearGradient>
    </defs>
  </svg>
  <ejs-accumulationchart
    *ngIf="series.length"
    [id]="chartElementId"
    [series]="series"
    [legendSettings]="legendSettings"
    [tooltip]="tooltipSettings"
    [margin]="margin"
    [enableAnimation]="true"
    (loaded)="onChartLoaded($event)"
    height="130px"
    width="100%"
  ></ejs-accumulationchart>
  <!-- Every slice is 0 (no readings at all for this metric — neither the
       trend API nor this circular chart's own config Data had anything, see
       buildCircularChartConfig()'s own comment) — a real Syncfusion pie has
       nothing to divide up in that case, so this renders a plain CSS ring
       instead of attempting one (see isEmpty's own comment).
       nx-circular-chart-card--disabled is a VISUAL cue only (dimmed) — the click
       itself stays live and behaves exactly like any other circular chart. An
       all-zero circular chart (e.g. no "high" readings at all) is still a real,
       meaningful selection: the map still needs to show every one of its
       markers, just all in the normal/green color, same as any other
       metric's own "normal" readings — confirmed this needs to work
       identically to a populated circular chart's click, not be blocked. -->
  <div
    class="nx-circular-chart-empty-ring"
    *ngIf="isEmpty"
    [class.nx-circular-chart-empty-ring--pie]="chartType === CircularChartTypes.Pie"
    [class.nx-circular-chart-empty-ring--semicircle]="chartType === CircularChartTypes.SemiCircle"
    [style.width.px]="emptyRingSizePx"
    [style.height.px]="emptyRingSizePx"
  ></div>
  <div
    class="nx-circular-chart-center"
    [class.nx-circular-chart-center--empty]="isEmpty"
    [style.left.px]="centerLabelPosition?.left"
    [style.top.px]="centerLabelPosition?.top"
  >
    {{ config?.label }}<ng-container *ngIf="isEmpty"><br /><span class="nx-circular-chart-empty-text">No data</span></ng-container>
  </div>
  <div class="nx-circular-chart-badge" *ngFor="let badge of badges" [style.left.px]="badge.left" [style.top.px]="badge.top">
    {{ badge.text }}
  </div>
</div>
