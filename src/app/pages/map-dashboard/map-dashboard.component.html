<div class="app-shell" [style.grid-template-columns]="appShellGridTemplateColumns">
  <app-nx-circular-chart-collection
    class="circular-chart-pane"
    [rawConfig]="circularChartRawConfig"
    [columns]="circularChartColumns"
    [rows]="circularChartRows"
    (sublayersSelected)="onSublayersSelected($event)"
  ></app-nx-circular-chart-collection>
  <app-nx-map-collection class="map-pane" [config]="mapCollectionConfig" [circularChartSelection]="circularChartSelection"></app-nx-map-collection>
</div>
