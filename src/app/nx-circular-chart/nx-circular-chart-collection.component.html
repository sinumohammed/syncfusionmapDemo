<div class="nx-circular-chart-panel" [ngClass]="theme">
  <div class="nx-circular-chart-title" *ngIf="rawConfig?.Title">{{ rawConfig?.Title }}</div>

  <!-- Loading (ApiUrl fetch in flight) takes priority over both the error
       and empty messages below — neither is known yet until the request
       settles. One grayed, shimmering placeholder card per skeletonItems
       entry (rawConfig's own visible chart count — see
       visibleCircularChartCount()'s own comment) in the SAME grid the real
       cards use, so the loading state reads as "these specific charts are
       about to appear" rather than a single generic spinner. -->
  <div class="nx-circular-chart-grid" [style.grid-template-columns]="'repeat(' + columns + ', 1fr)'" *ngIf="loading">
    <div class="nx-circular-chart-skeleton" *ngFor="let _ of skeletonItems">
      <span class="nx-circular-chart-skeleton-ring"></span>
      <span class="nx-circular-chart-skeleton-title"></span>
    </div>
  </div>

  <!-- Fetch error (ApiUrl set but the request itself failed) takes priority
       over the generic empty message below — a real error is more useful to
       surface than "no data", see fetchFailed's own comment. -->
  <div class="nx-circular-chart-message nx-circular-chart-message--error" *ngIf="!loading && fetchFailed">Failed to fetch data. Please try again later.</div>
  <div class="nx-circular-chart-message" *ngIf="!loading && !fetchFailed && !circularCharts.length">No data available.</div>

  <!-- rows > 0 — the sliding carousel: a fixed-width, overflow:hidden
       VIEWPORT clipping a wider TRACK laid out column-major (grid-auto-flow:
       column — see totalColumns' own comment) and animated via CSS
       transform, so scrolling one column over moves the same already-
       visible cards by one slot rather than swapping the whole grid's
       contents out at once (reported live: that swap read as the earlier
       items just vanishing, not "sliding out of view"). rows <= 0 (the
       default/unlimited case, see that Input's own comment) skips all of
       this for the plain, ordinary wrapping grid below instead — no
       viewport/track/dots markup at all. -->
  <div class="nx-circular-chart-viewport" *ngIf="!loading && circularCharts.length && rows > 0">
    <div
      class="nx-circular-chart-track"
      [style.width.%]="(totalColumns / columns) * 100"
      [style.grid-template-columns]="'repeat(' + totalColumns + ', 1fr)'"
      [style.grid-template-rows]="'repeat(' + rows + ', auto)'"
      [style.transform]="'translateX(' + trackTranslatePercent + '%)'"
    >
      <app-nx-circular-chart
        *ngFor="let circularChart of circularCharts"
        [config]="circularChart"
        [selected]="selectedId === circularChart.id"
        [palette]="seriesPalette"
        (select)="onCircularChartSelected(circularChart)"
      ></app-nx-circular-chart>
    </div>
  </div>

  <div class="nx-circular-chart-grid" [style.grid-template-columns]="'repeat(' + columns + ', 1fr)'" *ngIf="!loading && circularCharts.length && rows <= 0">
    <app-nx-circular-chart
      *ngFor="let circularChart of circularCharts"
      [config]="circularChart"
      [selected]="selectedId === circularChart.id"
      [palette]="seriesPalette"
      (select)="onCircularChartSelected(circularChart)"
    ></app-nx-circular-chart>
  </div>

  <!-- One dot per scroll position (columnOffsets) — only rendered once
       there's more than one, i.e. circularCharts.length actually exceeds
       rows*columns (see maxColumnOffset's own comment). Click a dot to jump
       straight to that column, same "carousel" behavior requested rather
       than prev/next arrows. -->
  <div class="nx-circular-chart-pagination" *ngIf="!loading && maxColumnOffset > 0">
    <button
      type="button"
      class="nx-circular-chart-pagination-dot"
      *ngFor="let offset of columnOffsets"
      [class.nx-circular-chart-pagination-dot--active]="offset === currentColumnOffset"
      [attr.aria-label]="'Go to column ' + (offset + 1)"
      (click)="goToColumn(offset)"
    ></button>
  </div>

  <div class="nx-circular-chart-legend" *ngIf="legendItems.length && showLegend">
    <div class="nx-circular-chart-legend-item" *ngFor="let item of legendItems">
      <!-- Shape: "Image" (only reachable with a real ImageUrl — see
           applyConfigs()'s own fallback-to-Circle when it's missing) draws
           the configured icon directly instead of a CSS-shaped swatch. -->
      <img class="nx-circular-chart-swatch nx-circular-chart-swatch--image" *ngIf="item.shape === 'Image'" [src]="item.imageUrl" alt="" />
      <span
        *ngIf="item.shape !== 'Image'"
        class="nx-circular-chart-swatch nx-circular-chart-swatch--{{ item.shape.toLowerCase() }}"
        [style.background]="item.shape === 'Triangle' || item.shape === 'InvertedTriangle' ? null : item.color"
        [style.border-bottom-color]="item.shape === 'Triangle' ? item.color : null"
        [style.border-top-color]="item.shape === 'InvertedTriangle' ? item.color : null"
      ></span>
      {{ item.label }}
    </div>
  </div>
</div>
