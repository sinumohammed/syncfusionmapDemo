<h2 mat-dialog-title class="nx-lld-dialog-title">
  {{ isEdit ? "Edit Group" : "Add Group" }}
  <span class="nx-lld-dialog-id" *ngIf="isEdit" title="Group ID">ID {{ data.group?.id }}</span>
</h2>
<mat-progress-bar *ngIf="saving" mode="indeterminate"></mat-progress-bar>
<div mat-dialog-content>
  <div [formGroup]="form" class="nx-lld-dialog-form">
    <div class="nx-lld-dialog-readonly">
      <span class="nx-lld-dialog-readonly-label">View</span>
      <span>{{ data.view.name }}</span>
    </div>

    <mat-form-field appearance="fill">
      <mat-label>Group Name</mat-label>
      <input matInput formControlName="name" (keydown.enter)="save()" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">Group name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>

    <div class="nx-lld-dialog-row">
      <mat-form-field appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let t of typeOptions" [value]="t.value">{{ t.label }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="nx-lld-dialog-order">
        <mat-label>Order</mat-label>
        <input matInput type="number" min="0" step="1" formControlName="order" />
        <mat-error *ngIf="form.get('order')?.hasError('required')">Order is required</mat-error>
        <mat-error *ngIf="form.get('order')?.hasError('min')">0 or more</mat-error>
      </mat-form-field>
    </div>

    <mat-slide-toggle formControlName="isVisible" color="primary" class="nx-lld-dialog-toggle">Visible</mat-slide-toggle>

    <div class="nx-lld-dialog-alert" role="alert" *ngIf="saveError">{{ saveError }}</div>
  </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving">Save</button>
</div>
